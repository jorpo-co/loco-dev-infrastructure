kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: {{cluster_name}}
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: {{http_port}}
        protocol: TCP
      - containerPort: 30443
        hostPort: {{tls_port}}
        protocol: TCP
  - role: worker